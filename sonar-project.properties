# ============================================
# SonarQube Configuration
# Code Quality and Security Analysis
# ============================================

# Project Identification
sonar.projectKey=headless-storefront
sonar.projectName=Headless Storefront
sonar.projectVersion=1.0

# Source and Test Directories
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/coverage/**,\
  **/.next/**,\
  **/public/**,\
  **/dist/**,\
  **/build/**

# Coverage Exclusions
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/types/**,\
  **/*.d.ts

# TypeScript/JavaScript Settings
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate
# Set to true to fail pipeline if quality gate fails
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Coverage Thresholds (adjust as needed)
# sonar.coverage.minimum=80

# Duplication Thresholds
# sonar.duplicatedBlocks.minimum=3
# sonar.duplicatedLines.minimum=10

# Code Smells
# sonar.technicalDebt.ratingGrid=0.05,0.1,0.2,0.5

# Security Hotspots
# Review security hotspots in SonarQube UI

# Additional Settings
sonar.links.homepage=https://your-domain.com
sonar.links.ci=https://gitlab.com/your-org/headless-storefront/pipelines
sonar.links.issue=https://gitlab.com/your-org/headless-storefront/issues

